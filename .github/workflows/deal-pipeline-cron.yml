name: Autonomous Deal Pipeline Cron

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deal-pipeline-cron
  cancel-in-progress: false

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deal Pipeline Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not configured in GitHub Secrets. Pipeline trigger cannot proceed."
            exit 1
          fi

          echo "Triggering RIIQX Autonomous Deal Pipeline with cryptographic secret validation..."

          RESPONSE=$(curl -s -S --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST "https://riiqx.vercel.app/api/cron/deal-pipeline" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Received HTTP Status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -ne 200 ]; then
            echo "::error::Pipeline failed with HTTP ${HTTP_STATUS}: ${HTTP_BODY}"
            exit 1
          fi

          if ! echo "${HTTP_BODY}" | grep -q '"success":true'; then
            echo "::error::Pipeline response indicated failure: ${HTTP_BODY}"
            exit 1
          fi

          echo "Deal pipeline sweep completed successfully."

