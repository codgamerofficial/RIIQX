<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" fill="none">
  <defs>
    <linearGradient id="r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161C" />
      <stop offset="100%" stop-color="#09090C" />
    </linearGradient>
    <linearGradient id="r-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA243C" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <linearGradient id="r-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Chassis -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="148" height="148" rx="40" fill="url(#r-bg)" stroke="url(#r-border)" stroke-width="2.5" />
    
    <!-- Classy "R" Acoustic Monogram -->
    <path
      d="M42 34C42 30 45 27 49 27H78C98 27 114 43 114 62C114 77 104 90 90 95L113 125C115 128 113 131 110 131H94C92 131 90 130 89 128L68 99H56V127C56 130 54 131 51 131H47C44 131 42 130 42 127V34Z"
      fill="url(#r-crimson)"
    />
    <rect x="56" y="42" width="24" height="30" rx="10" fill="#09090C" />
    
    <!-- Kinetic Soundwave Accents -->
    <rect x="118" y="52" width="5" height="22" rx="2.5" fill="#FA243C" opacity="0.85" />
    <rect x="127" y="40" width="5" height="44" rx="2.5" fill="#FA243C" />
    <rect x="136" y="60" width="5" height="16" rx="2.5" fill="#FA243C" opacity="0.65" />
  </g>

  <!-- Typography: RIIQX -->
  <g transform="translate(196, 68)">
    <text
      x="0"
      y="42"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="64"
      font-weight="900"
      letter-spacing="0.06em"
    >
      RIIQX
    </text>
    <circle cx="236" cy="18" r="7" fill="#FA243C" />

    <!-- Subtitle -->
    <text
      x="2"
      y="74"
      fill="#8E8E93"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="0.32em"
    >
      MUSIC &amp; INTELLIGENCE
    </text>
  </g>
</svg>
